<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12141C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Liegestütz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141C; --panel:#1B1E2A; --panel2:#232736; --line:#2E3345;
  --chalk:#EDEAE3; --dim:#868CA1; --amber:#F5A524; --teal:#3FB8A0; --rust:#D9604A;
  --num:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--ink); color:var(--chalk); font-family:var(--body)}
body{padding:0 16px calc(28px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; touch-action:manipulation}
h1,h2,h3{margin:0; font-weight:600}
button{font-family:inherit; color:inherit; border:0; background:none; cursor:pointer}
.hide{display:none !important}

/* ── Kopf ───────────────────────────────────── */
header{display:flex; align-items:baseline; justify-content:space-between; padding:18px 2px 8px}
header .day{font-family:var(--num); font-size:26px; letter-spacing:.02em}
header .meta{font-size:13px; color:var(--dim)}
#sync{font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px}
#sync .dot{width:7px; height:7px; border-radius:50%; background:var(--teal)}
#sync.pending .dot{background:var(--amber)}
#sync.error .dot{background:var(--rust)}

/* ── Ring ───────────────────────────────────── */
.ring-wrap{position:relative; display:flex; justify-content:center; margin:6px 0 4px}
.ring-wrap svg{width:min(74vw,290px); height:auto; display:block}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none}
.big{font-family:var(--num); font-weight:700; font-size:clamp(64px,21vw,92px); line-height:.9; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.goal{font-family:var(--num); font-size:19px; color:var(--dim); margin-top:8px; letter-spacing:.04em}
.goal b{color:var(--chalk); font-weight:600}
.ramp{font-size:12px; color:var(--dim); margin-top:3px}

/* ── Zähltasten ─────────────────────────────── */
.pad{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.pad button{background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:20px 0 16px; font-family:var(--num); font-weight:700; font-size:44px; line-height:1;
  font-variant-numeric:tabular-nums; transition:transform .06s ease, background .12s ease}
.pad button:active{transform:scale(.96); background:var(--amber); color:#12141C; border-color:var(--amber)}
.pad button span{display:block; font-family:var(--body); font-size:11px; font-weight:500; color:var(--dim); margin-top:6px}
.pad button:active span{color:#12141C}
.undo{width:100%; margin-top:10px; padding:13px; border-radius:12px; border:1px solid var(--line);
  color:var(--dim); font-size:14px; font-weight:500; background:transparent}
.undo:active{background:var(--panel)}
.undo:disabled{opacity:.35}

/* ── Kennzahlen ─────────────────────────────── */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:22px}
.stat{background:var(--ink); padding:14px 10px; text-align:center}
.stat .v{font-family:var(--num); font-weight:600; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
.stat .l{font-size:11px; color:var(--dim); margin-top:5px}

/* ── Panels ─────────────────────────────────── */
section{margin-top:26px}
.title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.title h2{font-family:var(--num); font-size:20px; letter-spacing:.03em}
.title .sub{font-size:12px; color:var(--dim)}
svg.chart{width:100%; height:auto; display:block; overflow:visible}

/* ── Einstellungen ──────────────────────────── */
details{margin-top:28px; border-top:1px solid var(--line); padding-top:14px}
summary{list-style:none; font-size:14px; color:var(--dim); padding:4px 0}
summary::-webkit-details-marker{display:none}
.field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0}
.field label{font-size:14px}
.field input,.field select{background:var(--panel); border:1px solid var(--line); color:var(--chalk);
  border-radius:9px; padding:9px 11px; font-family:var(--num); font-size:17px; width:130px; text-align:right}
.field select{font-family:var(--body); font-size:13px}
.save{width:100%; margin-top:12px; padding:13px; border-radius:12px; background:var(--panel2);
  border:1px solid var(--line); font-size:14px; font-weight:500}
.note{font-size:12px; color:var(--dim); line-height:1.5; margin-top:12px}

/* ── Tor ────────────────────────────────────── */
#gate{min-height:82vh; display:flex; flex-direction:column; justify-content:center; gap:14px}
#gate h1{font-family:var(--num); font-size:38px; letter-spacing:.02em}
#gate p{font-size:14px; color:var(--dim); line-height:1.55; margin:0}
#gate input{background:var(--panel); border:1px solid var(--line); color:var(--chalk);
  border-radius:12px; padding:15px; font-size:16px; width:100%}
#gate button{background:var(--amber); color:#12141C; border-radius:12px; padding:15px; font-size:15px; font-weight:600}
#gateMsg{color:var(--rust); font-size:13px; min-height:18px}
</style>
</head>
<body>

<!-- ══ Token-Tor ══ -->
<div id="gate" class="hide">
  <h1>Liegestütz</h1>
  <p>Einmalig den Zugriffs-Token eingeben. Er bleibt auf diesem Gerät gespeichert.</p>
  <input id="tokenInput" type="password" inputmode="text" autocomplete="off" placeholder="Token">
  <button id="tokenBtn">Öffnen</button>
  <div id="gateMsg"></div>
</div>

<!-- ══ App ══ -->
<main id="app" class="hide">

  <header>
    <div>
      <div class="day" id="dayLabel">–</div>
      <div class="meta" id="dateLabel">–</div>
    </div>
    <div id="sync"><span class="dot"></span><span id="syncText">gespeichert</span></div>
  </header>

  <div class="ring-wrap">
    <svg viewBox="0 0 200 200" id="ring" aria-hidden="true"></svg>
    <div class="ring-center">
      <div class="big" id="todayCount">0</div>
      <div class="goal">Ziel heute <b id="todayGoal">–</b></div>
      <div class="ramp" id="rampInfo"></div>
    </div>
  </div>

  <div class="pad">
    <button data-n="1">1<span>Stück</span></button>
    <button data-n="5">5<span>Stück</span></button>
    <button data-n="10">10<span>Stück</span></button>
    <button data-n="25">25<span>Stück</span></button>
  </div>
  <button class="undo" id="undoBtn">Letzte Eingabe rückgängig</button>

  <div class="stats">
    <div class="stat"><div class="v" id="sStreak">0</div><div class="l">Tage in Serie</div></div>
    <div class="stat"><div class="v" id="sWeek">0</div><div class="l">letzte 7 Tage</div></div>
    <div class="stat"><div class="v" id="sBest">0</div><div class="l">Bestwert</div></div>
  </div>

  <section>
    <div class="title"><h2>Letzte 7 Tage</h2><span class="sub" id="avg7"></span></div>
    <svg class="chart" id="bars" viewBox="0 0 340 170"></svg>
  </section>

  <section>
    <div class="title"><h2>Gesamt seit Tag 1</h2><span class="sub" id="totalSub"></span></div>
    <svg class="chart" id="cum" viewBox="0 0 340 150"></svg>
  </section>

  <details>
    <summary>Einstellungen</summary>
    <div class="field"><label for="fStart">Startziel</label><input id="fStart" type="number" inputmode="numeric"></div>
    <div class="field"><label for="fEnd">Endziel</label><input id="fEnd" type="number" inputmode="numeric"></div>
    <div class="field"><label for="fDays">Rampe in Tagen</label><input id="fDays" type="number" inputmode="numeric"></div>
    <div class="field"><label for="fMode">Steigerung</label>
      <select id="fMode"><option value="exp">prozentual</option><option value="lin">gleichmäßig</option></select></div>
    <div class="field"><label for="fFirst">Tag 1</label><input id="fFirst" type="date" style="width:160px"></div>
    <button class="save" id="saveCfg">Einstellungen speichern</button>
    <div class="note" id="cfgNote"></div>
    <button class="save" id="reload" style="margin-top:8px">Daten neu laden</button>
    <button class="save" id="forget" style="margin-top:8px; color:var(--rust)">Token auf diesem Gerät löschen</button>
  </details>

</main>

<script>
/* ═══════════════════════════════════════════════════════════
   HIER EINTRAGEN: die /exec-URL deines Apps-Script-Deployments
   ═══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbw19DY42V9m4yjzUXmP83Pj0T-1BUgmKj1iob3GXyN7bfOqq9QkGDxg4tU-vgPc71PQ8g/exec';

const K = { tok:'pu_token', cfg:'pu_cfg', queue:'pu_queue', cache:'pu_cache' };
const DEFAULTS = { start:10, end:1000, days:115, mode:'exp', first:null };

let token   = localStorage.getItem(K.tok) || '';
let cfg     = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(K.cfg) || '{}'));
let entries = JSON.parse(localStorage.getItem(K.cache) || '[]');   // {id,ts,date,count}
let queue   = JSON.parse(localStorage.getItem(K.queue) || '[]');   // {tmp,ts,date,count}
let flushTimer = null, retryDelay = 2000;

/* ── Datum ──────────────────────────────────── */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];

/* ── Ziel-Rampe ─────────────────────────────── */
function firstDay(){
  if (cfg.first) return cfg.first;
  const all = entries.concat(queue).map(e=>e.date).sort();
  return all.length ? all[0] : today();
}
function targetFor(date){
  const d = Math.max(0, daysBetween(firstDay(), date));
  const N = Math.max(2, cfg.days), s = Math.max(1, cfg.start), e = Math.max(s, cfg.end);
  if (d >= N-1) return e;
  const t = d/(N-1);
  return Math.round(cfg.mode==='lin' ? s + (e-s)*t : s * Math.pow(e/s, t));
}

/* ── Aggregation ────────────────────────────── */
function byDay(){
  const m = new Map();
  for (const e of entries.concat(queue)) m.set(e.date, (m.get(e.date)||0) + e.count);
  return m;
}
const sumFor = (m,d) => m.get(d) || 0;

function streakOf(m){
  let day = today(), n = 0;
  if (sumFor(m,day) < targetFor(day)) day = addDays(day,-1);   // heute läuft noch
  while (sumFor(m,day) >= targetFor(day) && sumFor(m,day) > 0){ n++; day = addDays(day,-1); }
  return n;
}

/* ── Synchronisation ────────────────────────── */
function setSync(state, text){
  const el = document.getElementById('sync');
  el.className = state;
  document.getElementById('syncText').textContent = text;
}
const save = () => {
  localStorage.setItem(K.queue, JSON.stringify(queue));
  localStorage.setItem(K.cache, JSON.stringify(entries));
};

async function post(payload){
  const res = await fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // kein CORS-Preflight
    body: JSON.stringify(Object.assign({token}, payload))
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Fehler');
  return data;
}

function scheduleFlush(ms=1200){
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}

async function flush(){
  if (!queue.length) { setSync('', 'gespeichert'); return; }
  const batch = queue.slice();
  setSync('pending', 'wird gespeichert …');
  try {
    const data = await post({ action:'addBatch', items: batch.map(b=>({ts:b.ts, date:b.date, count:b.count})) });
    const done = new Set(batch.map(b=>b.tmp));
    queue = queue.filter(q => !done.has(q.tmp));
    entries = entries.concat(data.entries);
    save(); render();
    retryDelay = 2000;
    setSync('', queue.length ? 'wird gespeichert …' : 'gespeichert');
    if (queue.length) scheduleFlush(300);
  } catch (err) {
    setSync('error', 'offline – wird nachgeholt');
    retryDelay = Math.min(retryDelay*2, 60000);
    scheduleFlush(retryDelay);
  }
}

async function load(){
  setSync('pending', 'lädt …');
  try {
    const res  = await fetch(API + '?action=list&token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    entries = data.entries;
    save(); render();
    setSync('', queue.length ? 'wird gespeichert …' : 'gespeichert');
    if (queue.length) flush();
    return true;
  } catch (err) {
    setSync('error', 'offline – zeige Zwischenstand');
    render();
    return false;
  }
}

/* ── Eingabe ────────────────────────────────── */
function addReps(n){
  if (navigator.vibrate) navigator.vibrate(12);
  queue.push({ tmp:'t'+Date.now()+Math.random(), ts:new Date().toISOString(), date:today(), count:n });
  save(); render(); setSync('pending','wird gespeichert …'); scheduleFlush();
}

async function undo(){
  if (queue.length){ queue.pop(); save(); render(); if(!queue.length) setSync('','gespeichert'); return; }
  const mine = entries.filter(e=>e.date===today()).sort((a,b)=>a.ts<b.ts?-1:1);
  if (!mine.length) return;
  const last = mine[mine.length-1];
  entries = entries.filter(e=>e.id!==last.id);
  save(); render(); setSync('pending','wird gespeichert …');
  try { await post({action:'delete', id:last.id}); setSync('','gespeichert'); }
  catch(e){ entries.push(last); save(); render(); setSync('error','löschen fehlgeschlagen'); }
}

/* ── Darstellung ────────────────────────────── */
function drawRing(progress){
  const TICKS = 52, cx=100, cy=100, r0=72, r1=90;
  const filled = Math.min(TICKS, Math.round(progress*TICKS));
  const over = progress >= 1;
  let s = '';
  for (let i=0;i<TICKS;i++){
    const a = (i/TICKS)*2*Math.PI - Math.PI/2;
    const on = i < filled;
    const col = on ? (over ? 'var(--teal)' : 'var(--amber)') : 'var(--line)';
    const w = on ? 5 : 3;
    s += `<line x1="${(cx+r0*Math.cos(a)).toFixed(1)}" y1="${(cy+r0*Math.sin(a)).toFixed(1)}"
            x2="${(cx+r1*Math.cos(a)).toFixed(1)}" y2="${(cy+r1*Math.sin(a)).toFixed(1)}"
            stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  }
  document.getElementById('ring').innerHTML = s;
}

function drawBars(m){
  const W=340, H=170, base=H-24, top=10, n=7;
  const days=[]; for(let i=n-1;i>=0;i--) days.push(addDays(today(),-i));
  const vals = days.map(d=>sumFor(m,d)), tgts = days.map(d=>targetFor(d));
  const max = Math.max(...vals, ...tgts, 1) * 1.12;
  const slot = W/n, bw = slot*0.5;
  let s='';
  days.forEach((d,i)=>{
    const x = i*slot + (slot-bw)/2;
    const h = Math.max(vals[i]>0?3:0, (vals[i]/max)*(base-top));
    const ty = base - (tgts[i]/max)*(base-top);
    const met = vals[i] >= tgts[i] && vals[i] > 0;
    s += `<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="4" fill="${met?'var(--teal)':'var(--amber)'}" opacity="${d===today()?1:.82}"/>`;
    s += `<line x1="${x-5}" y1="${ty}" x2="${x+bw+5}" y2="${ty}" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>`;
    if (vals[i]>0) s += `<text x="${x+bw/2}" y="${base-h-6}" text-anchor="middle" fill="var(--chalk)" font-family="Barlow Condensed" font-size="15">${vals[i]}</text>`;
    s += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" fill="var(--dim)" font-family="Inter" font-size="11">${WD[parseISO(d).getDay()]}</text>`;
  });
  s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`;
  document.getElementById('bars').innerHTML = s;
}

function drawCumulative(m){
  const W=340, H=150, base=H-22, top=12, left=0;
  const start = firstDay(), end = today();
  const n = Math.max(1, daysBetween(start,end));
  const pts=[]; let run=0;
  for (let i=0;i<=n;i++){ const d=addDays(start,i); run += sumFor(m,d); pts.push({d,run}); }
  const max = Math.max(run,1);
  const X = i => left + (n===0 ? W : (i/n)*W);
  const Y = v => base - (v/max)*(base-top);
  const line = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.run).toFixed(1)}`).join(' ');
  let s = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--amber)" stop-opacity=".38"/>
      <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>`;
  s += `<polygon points="${X(0)},${base} ${line} ${X(n)},${base}" fill="url(#g)"/>`;
  s += `<polyline points="${line}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<circle cx="${X(n)}" cy="${Y(run)}" r="4" fill="var(--amber)"/>`;
  s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
  s += `<text x="0" y="${H-5}" fill="var(--dim)" font-family="Inter" font-size="11">${parseISO(start).toLocaleDateString('de-AT',{day:'2-digit',month:'short'})}</text>`;
  s += `<text x="${W}" y="${H-5}" text-anchor="end" fill="var(--dim)" font-family="Inter" font-size="11">heute</text>`;
  document.getElementById('cum').innerHTML = s;
  return run;
}

function render(){
  const m = byDay(), t = today();
  const cnt = sumFor(m,t), goal = targetFor(t);

  const now = new Date();
  document.getElementById('dayLabel').textContent =
    now.toLocaleDateString('de-AT',{weekday:'long'});
  document.getElementById('dateLabel').textContent =
    now.toLocaleDateString('de-AT',{day:'2-digit', month:'long'});

  document.getElementById('todayCount').textContent = cnt;
  document.getElementById('todayGoal').textContent  = goal;
  drawRing(goal ? cnt/goal : 0);

  const dayNo = daysBetween(firstDay(), t) + 1;
  const left  = Math.max(0, goal - cnt);
  document.getElementById('rampInfo').textContent =
    cnt >= goal ? `Tag ${dayNo} · Ziel erreicht` : `Tag ${dayNo} · noch ${left}`;

  const week = [...Array(7)].reduce((a,_,i)=>a+sumFor(m,addDays(t,-i)),0);
  document.getElementById('sStreak').textContent = streakOf(m);
  document.getElementById('sWeek').textContent   = week.toLocaleString('de-AT');
  document.getElementById('sBest').textContent   = Math.max(0,...m.values()).toLocaleString('de-AT');
  document.getElementById('avg7').textContent    = 'Ø ' + Math.round(week/7) + ' pro Tag';

  drawBars(m);
  const total = drawCumulative(m);
  document.getElementById('totalSub').textContent = total.toLocaleString('de-AT') + ' Liegestütze';

  document.getElementById('undoBtn').disabled = !(queue.length || entries.some(e=>e.date===t));
  document.getElementById('cfgNote').textContent =
    `Ziel morgen ${targetFor(addDays(t,1))} · in 30 Tagen ${targetFor(addDays(t,30))} · ${cfg.end} ab ${parseISO(addDays(firstDay(), cfg.days-1)).toLocaleDateString('de-AT')}`;
}

/* ── Start ──────────────────────────────────── */
function showApp(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  fillCfg(); render(); load();
}
function fillCfg(){
  fStart.value=cfg.start; fEnd.value=cfg.end; fDays.value=cfg.days;
  fMode.value=cfg.mode;   fFirst.value=firstDay();
}

document.getElementById('tokenBtn').onclick = async () => {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) return;
  token = v;
  document.getElementById('gateMsg').textContent = 'prüfe …';
  try {
    const res  = await fetch(API + '?action=list&token=' + encodeURIComponent(v));
    const data = await res.json();
    if (!data.ok) throw new Error('Token stimmt nicht');
    localStorage.setItem(K.tok, v);
    entries = data.entries; save(); showApp();
  } catch(e){ document.getElementById('gateMsg').textContent = 'Token stimmt nicht oder keine Verbindung.'; }
};

document.querySelectorAll('.pad button').forEach(b =>
  b.addEventListener('click', () => addReps(+b.dataset.n)));
document.getElementById('undoBtn').onclick = undo;
document.getElementById('reload').onclick  = load;
document.getElementById('saveCfg').onclick = () => {
  cfg = { start:+fStart.value||60, end:+fEnd.value||1000, days:+fDays.value||180,
          mode:fMode.value, first:fFirst.value||null };
  localStorage.setItem(K.cfg, JSON.stringify(cfg));
  render();
};
document.getElementById('forget').onclick = () => {
  localStorage.removeItem(K.tok); location.reload();
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden){ if (queue.length) flush(); else load(); }
});
window.addEventListener('online', () => { if (queue.length) flush(); });

if (token) showApp(); else document.getElementById('gate').classList.remove('hide');
</script>
</body>
</html>
