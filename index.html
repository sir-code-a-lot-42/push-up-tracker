<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Liegestütz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette – hier anpassen, falls dir ein Ton nicht passt */
  --bg:#FFFFFF; --card:#F4F4F6; --line:#E4E4E8;
  --ink:#0E0E12; --dim:#76767F;
  --red:#E4002B; --green:#00875A;
  --font:'Archivo', -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font)}
body{max-width:560px; margin:0 auto; padding:0 18px calc(84px + env(safe-area-inset-bottom));}
button{font-family:inherit; color:inherit; border:0; background:none; cursor:pointer}
h1,h2{margin:0; font-weight:600}
.hide{display:none !important}

/* ── Kopfzeile ──────────────────────────────── */
header{display:flex; align-items:center; justify-content:space-between; padding:20px 0 10px}
.wordmark{font-size:15px; font-weight:700; letter-spacing:.16em}
#sync{font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px}
#sync .dot{width:7px; height:7px; border-radius:50%; background:var(--green)}
#sync.pending .dot{background:var(--red)}
#sync.error .dot{background:var(--dim)}

/* ── Ring ───────────────────────────────────── */
.datum{font-size:13px; color:var(--dim); text-align:center; margin-top:4px}
.ring-wrap{position:relative; display:flex; justify-content:center; margin:2px 0 0}
.ring-wrap svg{width:min(70vw,270px); height:auto; display:block}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.big{font-size:clamp(56px,18vw,80px); font-weight:700; line-height:1; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.goal{font-size:14px; color:var(--dim); margin-top:6px}
.goal b{color:var(--ink); font-weight:600}
.rest{font-size:12px; color:var(--dim); margin-top:2px}

/* ── Zähltasten ─────────────────────────────── */
.pad{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px}
.pad button{background:var(--card); border-radius:14px; padding:19px 0 15px;
  font-size:38px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;
  transition:transform .06s ease, background .1s ease}
.pad button:active{transform:scale(.96); background:var(--red); color:#fff}
.pad button span{display:block; font-size:11px; font-weight:500; color:var(--dim); margin-top:5px}
.pad button:active span{color:rgba(255,255,255,.8)}
.undo{width:100%; margin-top:9px; padding:13px; border-radius:12px; border:1px solid var(--line);
  color:var(--dim); font-size:14px; font-weight:500}
.undo:active{background:var(--card)}
.undo:disabled{opacity:.4}

/* ── Kennzahlen ─────────────────────────────── */
.stats{display:grid; grid-template-columns:repeat(3,1fr); margin-top:22px;
  border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.stat{padding:15px 6px; text-align:center; border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .v{font-size:27px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.stat .l{font-size:11px; color:var(--dim); margin-top:5px}

/* ── Abschnitte ─────────────────────────────── */
section{margin-top:26px}
.title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.title h2{font-size:15px; font-weight:600}
.title .sub{font-size:12px; color:var(--dim)}
svg.chart{width:100%; height:auto; display:block; overflow:visible}
.legend{display:flex; gap:16px; font-size:11px; color:var(--dim); margin-top:8px}
.legend i{display:inline-block; width:14px; height:2px; background:var(--red); vertical-align:middle; margin-right:5px}
.legend i.dot{width:7px; height:7px; border-radius:50%; background:var(--ink)}

/* ── Zielliste ──────────────────────────────── */
.rows{border-top:1px solid var(--line)}
.row{display:flex; align-items:baseline; justify-content:space-between; padding:11px 2px; border-bottom:1px solid var(--line)}
.row .d{font-size:14px}
.row .d em{font-style:normal; color:var(--dim); font-size:12px; margin-left:7px}
.row .t{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
.row.now{background:var(--card); margin:0 -18px; padding-left:18px; padding-right:18px}
.row.mile .t{color:var(--red)}
.more{width:100%; margin-top:12px; padding:12px; border-radius:12px; border:1px solid var(--line);
  font-size:13px; font-weight:500; color:var(--dim)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{padding:5px 11px; font-size:11px; font-weight:500; color:var(--dim)}
.seg button.on{background:var(--ink); color:#fff}

/* ── Einstellungen ──────────────────────────── */
details{margin-top:30px; border-top:1px solid var(--line); padding-top:12px}
summary{list-style:none; font-size:13px; color:var(--dim); padding:5px 0}
summary::-webkit-details-marker{display:none}
.field{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0}
.field label{font-size:14px}
.field input,.field select{background:var(--card); border:0; color:var(--ink); border-radius:9px;
  padding:10px 12px; font-family:inherit; font-size:15px; width:135px; text-align:right}
.field select{text-align:left}
.act{width:100%; margin-top:10px; padding:13px; border-radius:12px; background:var(--card); font-size:14px; font-weight:500}
.note{font-size:12px; color:var(--dim); line-height:1.55; margin-top:12px}

/* ── Tab-Leiste ─────────────────────────────── */
nav{position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5}
nav button{flex:1; padding:11px 0 12px; font-size:11px; font-weight:500; color:var(--dim);
  display:flex; flex-direction:column; align-items:center; gap:4px}
nav button.on{color:var(--red)}
nav svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8}

/* ── Tor ────────────────────────────────────── */
#gate{min-height:80vh; display:flex; flex-direction:column; justify-content:center; gap:14px}
#gate h1{font-size:30px; font-weight:700; letter-spacing:-.02em}
#gate p{font-size:14px; color:var(--dim); line-height:1.55; margin:0}
#gate input{background:var(--card); border:0; color:var(--ink); border-radius:12px; padding:15px; font-size:16px; width:100%; font-family:inherit}
#gate button{background:var(--red); color:#fff; border-radius:12px; padding:15px; font-size:15px; font-weight:600}
#gateMsg{color:var(--red); font-size:13px; min-height:18px}
</style>
</head>
<body>

<!-- ══ Token-Tor ══ -->
<div id="gate" class="hide">
  <h1>Liegestütz</h1>
  <p>Einmalig den Zugriffs-Token eingeben. Er bleibt auf diesem Gerät gespeichert.</p>
  <input id="tokenInput" type="password" inputmode="text" autocomplete="off" placeholder="Token">
  <button id="tokenBtn">Öffnen</button>
  <div id="gateMsg"></div>
</div>

<!-- ══ App ══ -->
<main id="app" class="hide">

  <header>
    <div class="wordmark">LIEGESTÜTZ</div>
    <div id="sync"><span class="dot"></span><span id="syncText">gespeichert</span></div>
  </header>

  <!-- ── Tab: Heute ── -->
  <div id="tabHeute">
    <div class="datum" id="dateLabel">–</div>

    <div class="ring-wrap">
      <svg viewBox="0 0 200 200" id="ring" aria-hidden="true"></svg>
      <div class="ring-center">
        <div class="big" id="todayCount">0</div>
        <div class="goal">Ziel heute <b id="todayGoal">–</b></div>
        <div class="rest" id="restInfo"></div>
      </div>
    </div>

    <div class="pad">
      <button data-n="1">1<span>Stück</span></button>
      <button data-n="5">5<span>Stück</span></button>
      <button data-n="10">10<span>Stück</span></button>
      <button data-n="25">25<span>Stück</span></button>
    </div>
    <button class="undo" id="undoBtn">Letzte Eingabe rückgängig</button>

    <div class="stats">
      <div class="stat"><div class="v" id="sStreak">0</div><div class="l">Tage in Serie</div></div>
      <div class="stat"><div class="v" id="sWeek">0</div><div class="l">letzte 7 Tage</div></div>
      <div class="stat"><div class="v" id="sBest">0</div><div class="l">Bestwert</div></div>
    </div>

    <section>
      <div class="title"><h2>Letzte 7 Tage</h2><span class="sub" id="avg7"></span></div>
      <svg class="chart" id="bars" viewBox="0 0 340 170"></svg>
    </section>
  </div>

  <!-- ── Tab: Plan ── -->
  <div id="tabPlan" class="hide">
    <section style="margin-top:14px">
      <div class="title">
        <h2>Ziel bis zum Ende</h2>
        <span class="seg"><button id="segLog" class="on">log</button><button id="segLin">linear</button></span>
      </div>
      <svg class="chart" id="plan" viewBox="0 0 340 215"></svg>
      <div class="legend"><span><i></i>Tagesziel</span><span><i class="dot"></i>tatsächlich geschafft</span></div>
    </section>

    <section>
      <div class="title"><h2>Gesamtsumme</h2><span class="sub" id="totalSub"></span></div>
      <svg class="chart" id="cum" viewBox="0 0 340 130"></svg>
    </section>

    <section>
      <div class="title"><h2>Kommende Ziele</h2><span class="sub" id="planSub"></span></div>
      <div class="rows" id="planList"></div>
      <button class="more" id="moreBtn">Alle Tage bis zum Ende anzeigen</button>
    </section>

    <details>
      <summary>Einstellungen</summary>
      <div class="field"><label for="fStart">Startziel</label><input id="fStart" type="number" inputmode="numeric"></div>
      <div class="field"><label for="fEnd">Endziel</label><input id="fEnd" type="number" inputmode="numeric"></div>
      <div class="field"><label for="fDays">Rampe in Tagen</label><input id="fDays" type="number" inputmode="numeric"></div>
      <div class="field"><label for="fMode">Steigerung</label>
        <select id="fMode"><option value="exp">prozentual</option><option value="lin">gleichmäßig</option></select></div>
      <div class="field"><label for="fFirst">Tag 1</label><input id="fFirst" type="date" style="width:165px"></div>
      <button class="act" id="saveCfg">Einstellungen speichern</button>
      <div class="note" id="cfgNote"></div>
      <button class="act" id="reload">Daten neu laden</button>
      <button class="act" id="forget" style="color:var(--red)">Token auf diesem Gerät löschen</button>
    </details>
  </div>

</main>

<nav id="nav" class="hide">
  <button data-tab="heute" class="on">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 7 4"/></svg>
    Heute</button>
  <button data-tab="plan">
    <svg viewBox="0 0 24 24"><path d="M3 19h18"/><path d="M4 16c4-1 7-4 8-7s3-5 8-6"/></svg>
    Plan</button>
</nav>

<script>
/* ═══════════════════════════════════════════════════════════
   HIER EINTRAGEN: die /exec-URL deines Apps-Script-Deployments
   ═══════════════════════════════════════════════════════════ */
const API = 'https://script.google.com/macros/s/AKfycbw19DY42V9m4yjzUXmP83Pj0T-1BUgmKj1iob3GXyN7bfOqq9QkGDxg4tU-vgPc71PQ8g/exec';


const K = { tok:'pu_token', cfg:'pu_cfg', queue:'pu_queue', cache:'pu_cache' };
const DEFAULTS = { start:10, end:1000, days:115, mode:'exp', first:null };

let token   = localStorage.getItem(K.tok) || '';
let cfg     = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(K.cfg) || '{}'));
let entries = JSON.parse(localStorage.getItem(K.cache) || '[]');
let queue   = JSON.parse(localStorage.getItem(K.queue) || '[]');
let flushTimer = null, retryDelay = 2000;
let planLog = true, showAll = false, tab = 'heute';

/* ── Datum ──────────────────────────────────── */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => iso(new Date());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MO = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const short = s => { const d=parseISO(s); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'; };

/* ── Ziel-Rampe ─────────────────────────────── */
function firstDay(){
  if (cfg.first) return cfg.first;
  const all = entries.concat(queue).map(e=>e.date).sort();
  return all.length ? all[0] : today();
}
const lastDay = () => addDays(firstDay(), cfg.days-1);

function targetForIndex(d){
  const N = Math.max(2, cfg.days), s = Math.max(1, cfg.start), e = Math.max(s, cfg.end);
  if (d <= 0) return s;
  if (d >= N-1) return e;
  const t = d/(N-1);
  return Math.round(cfg.mode==='lin' ? s + (e-s)*t : s * Math.pow(e/s, t));
}
const targetFor = date => targetForIndex(daysBetween(firstDay(), date));

/* ── Aggregation ────────────────────────────── */
function byDay(){
  const m = new Map();
  for (const e of entries.concat(queue)) m.set(e.date, (m.get(e.date)||0) + e.count);
  return m;
}
const sumFor = (m,d) => m.get(d) || 0;

function streakOf(m){
  let day = today(), n = 0;
  if (sumFor(m,day) < targetFor(day)) day = addDays(day,-1);
  while (sumFor(m,day) >= targetFor(day) && sumFor(m,day) > 0){ n++; day = addDays(day,-1); }
  return n;
}

/* ── Synchronisation ────────────────────────── */
function setSync(state, text){
  document.getElementById('sync').className = state;
  document.getElementById('syncText').textContent = text;
}
const save = () => {
  localStorage.setItem(K.queue, JSON.stringify(queue));
  localStorage.setItem(K.cache, JSON.stringify(entries));
};

async function post(payload){
  const res  = await fetch(API, { method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({token}, payload)) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Fehler');
  return data;
}
function scheduleFlush(ms=1200){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }

async function flush(){
  if (!queue.length){ setSync('', 'gespeichert'); return; }
  const batch = queue.slice();
  setSync('pending', 'wird gespeichert …');
  try {
    const data = await post({ action:'addBatch', items: batch.map(b=>({ts:b.ts, date:b.date, count:b.count})) });
    const done = new Set(batch.map(b=>b.tmp));
    queue = queue.filter(q => !done.has(q.tmp));
    entries = entries.concat(data.entries);
    save(); render(); retryDelay = 2000;
    setSync('', queue.length ? 'wird gespeichert …' : 'gespeichert');
    if (queue.length) scheduleFlush(300);
  } catch (err) {
    setSync('error', 'offline – wird nachgeholt');
    retryDelay = Math.min(retryDelay*2, 60000);
    scheduleFlush(retryDelay);
  }
}

async function load(){
  setSync('pending', 'lädt …');
  try {
    const res  = await fetch(API + '?action=list&token=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    entries = data.entries; save(); render();
    setSync('', queue.length ? 'wird gespeichert …' : 'gespeichert');
    if (queue.length) flush();
  } catch (err) {
    setSync('error', 'offline – zeige Zwischenstand'); render();
  }
}

/* ── Eingabe ────────────────────────────────── */
function addReps(n){
  if (navigator.vibrate) navigator.vibrate(12);
  queue.push({ tmp:'t'+Date.now()+Math.random(), ts:new Date().toISOString(), date:today(), count:n });
  save(); render(); setSync('pending','wird gespeichert …'); scheduleFlush();
}
async function undo(){
  if (queue.length){ queue.pop(); save(); render(); if(!queue.length) setSync('','gespeichert'); return; }
  const mine = entries.filter(e=>e.date===today()).sort((a,b)=>a.ts<b.ts?-1:1);
  if (!mine.length) return;
  const last = mine[mine.length-1];
  entries = entries.filter(e=>e.id!==last.id);
  save(); render(); setSync('pending','wird gespeichert …');
  try { await post({action:'delete', id:last.id}); setSync('','gespeichert'); }
  catch(e){ entries.push(last); save(); render(); setSync('error','löschen fehlgeschlagen'); }
}

/* ── Ring ───────────────────────────────────── */
function drawRing(p){
  const cx=100, cy=100, r=82, C=2*Math.PI*r;
  const frac = Math.max(0, Math.min(1, p));
  const col = p>=1 ? 'var(--green)' : 'var(--red)';
  document.getElementById('ring').innerHTML =
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
     <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="9"
       stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}"
       transform="rotate(-90 ${cx} ${cy})"/>`;
}

/* ── 7-Tage-Balken ──────────────────────────── */
function drawBars(m){
  const W=340, H=170, base=H-24, top=10, n=7, slot=W/n, bw=slot*0.46;
  const days=[]; for(let i=n-1;i>=0;i--) days.push(addDays(today(),-i));
  const vals=days.map(d=>sumFor(m,d)), tg=days.map(d=>targetFor(d));
  const max=Math.max(...vals,...tg,1)*1.15;
  let s='';
  days.forEach((d,i)=>{
    const x=i*slot+(slot-bw)/2;
    const h=Math.max(vals[i]>0?3:0,(vals[i]/max)*(base-top));
    const ty=base-(tg[i]/max)*(base-top);
    const met=vals[i]>=tg[i]&&vals[i]>0;
    s+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="3" fill="${met?'var(--green)':'var(--red)'}"/>`;
    s+=`<line x1="${x-5}" y1="${ty}" x2="${x+bw+5}" y2="${ty}" stroke="var(--dim)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    if(vals[i]>0) s+=`<text x="${x+bw/2}" y="${base-h-7}" text-anchor="middle" fill="var(--ink)" font-family="Archivo" font-size="13" font-weight="600">${vals[i]}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" fill="var(--dim)" font-family="Archivo" font-size="11">${WD[parseISO(d).getDay()]}</text>`;
  });
  s+=`<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
  document.getElementById('bars').innerHTML=s;
}

/* ── Planchart: Zielkurve + Ist-Werte ───────── */
function drawPlan(m){
  const W=340,H=215, L=30, T=10, base=H-24, right=W-4;
  const N=Math.max(2,cfg.days), start=firstDay();
  const vmax=cfg.end*1.12, vmin=Math.max(1, cfg.start*0.65);
  const X = i => L + (i/(N-1))*(right-L);
  const Y = v => {
    if(planLog){
      const c=Math.max(vmin,Math.min(vmax,v));
      return base-(Math.log(c/vmin)/Math.log(vmax/vmin))*(base-T);
    }
    return base-(Math.min(v,vmax)/vmax)*(base-T);
  };
  let s='';

  const ticks = planLog ? [10,20,50,100,200,500,1000].filter(v=>v>=vmin&&v<=vmax)
                        : [0,250,500,750,1000].filter(v=>v<=vmax);
  ticks.forEach(v=>{
    const y=Y(v);
    s+=`<line x1="${L}" y1="${y}" x2="${right}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${y+4}" text-anchor="end" fill="var(--dim)" font-family="Archivo" font-size="10">${v}</text>`;
  });

  // Monatsmarken auf der x-Achse
  for(let i=0;i<N;i++){
    const d=parseISO(addDays(start,i));
    if(i===0 || d.getDate()===1){
      s+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" fill="var(--dim)" font-family="Archivo" font-size="10">${MO[d.getMonth()]}</text>`;
    }
  }

  // Zielkurve
  let pts=[]; for(let i=0;i<N;i++) pts.push(X(i).toFixed(1)+','+Y(targetForIndex(i)).toFixed(1));
  s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linejoin="round"/>`;

  // Heute-Marke
  const ti=daysBetween(start,today());
  if(ti>=0&&ti<N){
    s+=`<line x1="${X(ti)}" y1="${T}" x2="${X(ti)}" y2="${base}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>`;
  }

  // Ist-Werte
  m.forEach((v,d)=>{
    const i=daysBetween(start,d);
    if(i<0||i>=N||v<=0) return;
    const met=v>=targetForIndex(i);
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.1"
         fill="${met?'var(--green)':'var(--ink)'}"/>`;
  });

  s+=`<line x1="${L}" y1="${base}" x2="${right}" y2="${base}" stroke="var(--line)"/>`;
  document.getElementById('plan').innerHTML=s;
}

/* ── Kumulative Summe ───────────────────────── */
function drawCumulative(m){
  const W=340,H=130, base=H-20, top=10;
  const start=firstDay(), n=Math.max(1,daysBetween(start,today()));
  const pts=[]; let run=0;
  for(let i=0;i<=n;i++){ run+=sumFor(m,addDays(start,i)); pts.push(run); }
  const max=Math.max(run,1);
  const X=i=>(i/n)*W, Y=v=>base-(v/max)*(base-top);
  const line=pts.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  let s=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--red)" stop-opacity=".16"/>
    <stop offset="100%" stop-color="var(--red)" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<polygon points="0,${base} ${line} ${W},${base}" fill="url(#g)"/>`;
  s+=`<polyline points="${line}" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linejoin="round"/>`;
  s+=`<circle cx="${W}" cy="${Y(run)}" r="3.5" fill="var(--red)"/>`;
  s+=`<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
  document.getElementById('cum').innerHTML=s;
  return run;
}

/* ── Zielliste ──────────────────────────────── */
function renderList(m){
  const start=firstDay(), N=cfg.days, ti=daysBetween(start,today());
  const to = showAll ? N-1 : Math.min(N-1, ti+14);
  const miles=new Set();
  [25,50,100,250,500,750,1000].forEach(v=>{
    for(let i=0;i<N;i++){ if(targetForIndex(i)>=v){ miles.add(i+':'+v); break; } }
  });
  const mileAt = i => { for(const s of miles){ const [k,v]=s.split(':'); if(+k===i) return +v; } return 0; };

  let html='';
  for(let i=Math.max(0,ti); i<=to; i++){
    const d=addDays(start,i), dt=parseISO(d), t=targetForIndex(i);
    const isNow=(i===ti), mv=mileAt(i), done=sumFor(m,d);
    html+=`<div class="row ${isNow?'now':''} ${mv?'mile':''}">
      <span class="d">${WD[dt.getDay()]} ${short(d)}
        <em>${isNow ? 'heute · '+done+' geschafft' : (mv ? mv+'er-Marke' : 'Tag '+(i+1))}</em></span>
      <span class="t">${t}</span></div>`;
  }
  document.getElementById('planList').innerHTML=html;
  document.getElementById('moreBtn').textContent =
    showAll ? 'Nur die nächsten 14 Tage' : 'Alle Tage bis zum Ende anzeigen';
  document.getElementById('planSub').textContent =
    'bis ' + short(lastDay()) + ' · ' + Math.max(0, N-1-ti) + ' Tage übrig';
}

/* ── Gesamtausgabe ──────────────────────────── */
function render(){
  const m=byDay(), t=today(), cnt=sumFor(m,t), goal=targetFor(t);
  const now=new Date();
  document.getElementById('dateLabel').textContent =
    now.toLocaleDateString('de-AT',{weekday:'long', day:'numeric', month:'long'});
  document.getElementById('todayCount').textContent=cnt;
  document.getElementById('todayGoal').textContent=goal;
  drawRing(goal?cnt/goal:0);
  const dayNo=daysBetween(firstDay(),t)+1;
  document.getElementById('restInfo').textContent =
    cnt>=goal ? `Tag ${dayNo} · geschafft` : `Tag ${dayNo} · noch ${goal-cnt}`;

  const week=[...Array(7)].reduce((a,_,i)=>a+sumFor(m,addDays(t,-i)),0);
  document.getElementById('sStreak').textContent=streakOf(m);
  document.getElementById('sWeek').textContent=week.toLocaleString('de-AT');
  document.getElementById('sBest').textContent=Math.max(0,...m.values()).toLocaleString('de-AT');
  document.getElementById('avg7').textContent='Ø '+Math.round(week/7)+' pro Tag';
  drawBars(m);

  drawPlan(m);
  const total=drawCumulative(m);
  document.getElementById('totalSub').textContent=total.toLocaleString('de-AT')+' seit Tag 1';
  renderList(m);

  document.getElementById('undoBtn').disabled=!(queue.length||entries.some(e=>e.date===t));
  const step = cfg.mode==='lin'
    ? '+'+Math.round((cfg.end-cfg.start)/(cfg.days-1))+' pro Tag'
    : '+'+((Math.pow(cfg.end/cfg.start,1/(cfg.days-1))-1)*100).toFixed(1)+' % pro Tag';
  document.getElementById('cfgNote').textContent =
    `${step} · Ziel morgen ${targetFor(addDays(t,1))} · in 30 Tagen ${targetFor(addDays(t,30))} · ${cfg.end} am ${short(lastDay())}`;
}

/* ── Start & Bedienung ──────────────────────── */
function showApp(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('nav').classList.remove('hide');
  fillCfg(); render(); load();
}
function fillCfg(){
  fStart.value=cfg.start; fEnd.value=cfg.end; fDays.value=cfg.days;
  fMode.value=cfg.mode;   fFirst.value=firstDay();
}
function setTab(name){
  tab=name;
  document.getElementById('tabHeute').classList.toggle('hide', name!=='heute');
  document.getElementById('tabPlan').classList.toggle('hide', name!=='plan');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  window.scrollTo(0,0);
}

document.getElementById('tokenBtn').onclick = async () => {
  const v=document.getElementById('tokenInput').value.trim(); if(!v) return;
  token=v; document.getElementById('gateMsg').textContent='prüfe …';
  try{
    const res=await fetch(API+'?action=list&token='+encodeURIComponent(v));
    const data=await res.json(); if(!data.ok) throw new Error();
    localStorage.setItem(K.tok,v); entries=data.entries; save(); showApp();
  }catch(e){ document.getElementById('gateMsg').textContent='Token stimmt nicht oder keine Verbindung.'; }
};

document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>addReps(+b.dataset.n)));
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.getElementById('undoBtn').onclick=undo;
document.getElementById('reload').onclick=load;
document.getElementById('moreBtn').onclick=()=>{ showAll=!showAll; render(); };
document.getElementById('segLog').onclick=()=>{ planLog=true;  segLog.classList.add('on'); segLin.classList.remove('on'); render(); };
document.getElementById('segLin').onclick=()=>{ planLog=false; segLin.classList.add('on'); segLog.classList.remove('on'); render(); };
document.getElementById('saveCfg').onclick=()=>{
  cfg={ start:+fStart.value||10, end:+fEnd.value||1000, days:+fDays.value||115,
        mode:fMode.value, first:fFirst.value||null };
  localStorage.setItem(K.cfg, JSON.stringify(cfg)); render();
};
document.getElementById('forget').onclick=()=>{ localStorage.removeItem(K.tok); location.reload(); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ queue.length?flush():load(); } });
window.addEventListener('online',()=>{ if(queue.length) flush(); });

if (token) showApp(); else document.getElementById('gate').classList.remove('hide');
</script>
